# Experiment Settings
wandb_project: Qwen3-0.6B
wandb_run_name: null
wandb_tags: ["topk"]
seed: 42

# Model Configuration  
tlens_model_name: "Qwen/Qwen3-0.6B" 
tlens_model_path: null

# Training Configuration
save_every_n_samples: null
eval_every_n_samples: 40_000
gradient_accumulation_steps: 2
lr: 5e-4
lr_schedule: cosine
min_lr_factor: 0.1
warmup_samples: 20_000
max_grad_norm: 10.0
log_every_n_grad_steps: 20

# Data Configuration
data:
  dataset_name: "HuggingFaceFW/fineweb"
  tokenizer_name: "Qwen/Qwen3-0.6B"
  context_length: 1024
  n_train_samples: 300_000
  n_eval_samples: 1_000
  train_batch_size: 4
  eval_batch_size: 4
  streaming: true
  seed: null
  is_tokenized: false
  column_name: "input_ids"
  split: "train"

# SAE Configuration - Hard Concrete SAE with learned gates
saes:
  name: "topk_sae"
  sae_type: "topk"
  dict_size_to_input_ratio: 32.0
  pretrained_sae_paths: null
  retrain_saes: false
  sae_positions:
    - blocks.2.hook_resid_pre
    - blocks.6.hook_resid_pre
    - blocks.10.hook_resid_pre
    - blocks.14.hook_resid_pre
    - blocks.18.hook_resid_pre
    - blocks.22.hook_resid_pre
    - blocks.26.hook_resid_pre
  init_decoder_orthogonal: true
  sparsity_coeff: null
  k: 32
  tied_encoder_init: true
  aux_k: null
  aux_coeff: null